name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - master  # Or 'main' if your default branch is named that

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEWS_LETTER_4AC08 }}
          channelId: live  # This sets it to deploy to the LIVE site
          projectId: news-letter-4ac08

